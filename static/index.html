<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-fluent</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- A shell. Every screen carries its own markup in static/views/. -->

<div class="shell">

  <aside class="sidebar">
    <a class="brand" href="#/hoy">claude-fluent</a>

    <nav id="nav">
      <a href="#/hoy"      data-route="hoy">Hoy</a>
      <a href="#/progreso" data-route="progreso">Progreso</a>
      <a href="#/mazos"    data-route="mazos">Mazos</a>
      <a href="#/atascos"  data-route="atascos">Atascos</a>
      <a href="#/ajustes"  data-route="ajustes">Ajustes</a>
      <!-- Último a propósito: a Hoy se entra a empezar, al Dashboard a mirar. -->
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
    </nav>

    <!-- The level chip beside each skill is the summary you read without
         entering. It stays visible on every screen: in a sidebar a section
         that appears and disappears makes the whole column jump. -->
    <div class="nav-section">
      <span class="nav-label">Habilidades</span>
      <nav id="skillbar">
        <a href="#/skill/grammar"   data-skill="grammar">Grammar <span class="chip-level"></span></a>
        <a href="#/skill/writing"   data-skill="writing">Writing <span class="chip-level"></span></a>
        <a href="#/skill/speaking"  data-skill="speaking">Speaking <span class="chip-level"></span></a>
        <a href="#/skill/listening" data-skill="listening">Listening <span class="chip-level"></span></a>
        <a href="#/skill/reading"   data-skill="reading">Reading <span class="chip-level"></span></a>
      </nav>
    </div>
  </aside>

  <div class="content">
    <p id="offline" class="offline" hidden></p>
    <main id="view"></main>
  </div>

</div>

<script type="module" src="/app.js"></script>
</body>
</html>
